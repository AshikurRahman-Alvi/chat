<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enter reset code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E5D3AF; --card: #F5EFE1; --ink: #2e0a0e; --muted: #6b4b4e;
    --line: #E5D3AF; --edge: #AEC4D4; --field: color-mix(in srgb, #F5EFE1 45%, white);
    --accent: #790D16; --accent-hover: #5c0a11; --accent-ink: #F5EFE1;
    --focus: #AEC4D4; --error: #790D16;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body);
    font-size: 16px; line-height: 1.5; min-height: 100%;
    display: grid; place-items: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(40px + env(safe-area-inset-bottom, 0px));
  }
  .card {
    position: relative; width: 100%; max-width: 420px; background: var(--card);
    border-radius: 28px 28px 28px 6px; padding: 40px 32px 32px; margin-bottom: 18px;
  }
  .card::after {
    content: ""; position: absolute; left: 0; bottom: -18px; width: 26px; height: 20px;
    background: var(--card); clip-path: polygon(0 0, 100% 0, 0 100%);
  }
  h1 { font-family: var(--display); font-weight: 700; font-size: 2.1rem; line-height: 1.1; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin-top: 8px; margin-bottom: 28px; }
  .sub strong { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
  .field { margin-bottom: 18px; }
  label, .legend { display: block; font-weight: 600; font-size: 0.95rem; margin-bottom: 6px; }
  a, .linkbtn {
    color: var(--accent); text-decoration: none; font: inherit; font-weight: 600;
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  a:hover, .linkbtn:hover { text-decoration: underline; text-underline-offset: 3px; }
  .linkbtn:disabled { color: var(--muted); cursor: default; font-weight: 500; text-decoration: none; }
  input {
    width: 100%; font: inherit; color: var(--ink); background: var(--field);
    border: 1.5px solid var(--edge); border-radius: 14px; padding: 13px 16px;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--muted); opacity: .8; }
  input:hover { border-color: var(--muted); }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  input[aria-invalid="true"] { border-color: var(--error); }
  .error { color: var(--error); font-size: 0.875rem; margin-top: 6px; }
  .error:empty { display: none; }
  .btn {
    width: 100%; font: inherit; font-weight: 600; color: var(--accent-ink);
    background: var(--accent); border: 0; border-radius: 14px; padding: 14px 16px;
    margin-top: 6px; cursor: pointer; transition: background .15s, transform .1s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(.985); }
  .btn:focus-visible, .linkbtn:focus-visible, a:focus-visible {
    outline: 3px solid var(--edge); outline-offset: 2px; border-radius: 6px;
  }
  .divider { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 0.875rem; margin: 24px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .signin, .again { text-align: center; color: var(--muted); }
  .again { margin-top: 18px; }
  .again form { display: inline; }
  .otp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 4px; }
  .otp input {
    min-width: 0; aspect-ratio: 1 / 1.15; font-family: var(--display);
    font-size: 1.6rem; font-weight: 700; text-align: center; padding: 0;
  }
  .legal { max-width: 420px; padding-left: 28px; color: var(--muted); font-size: 0.8125rem; }
  @media (max-width: 420px) { .card { padding: 32px 22px 26px; } .legal { padding-left: 22px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <main style="width:100%;max-width:420px">
    <div class="card">
      <h1>Check your inbox</h1>
      <p class="sub">If an account exists for <strong>{{ email }}</strong>, we've sent a 6-digit code to it. It expires in 10 minutes.</p>

      <form id="code-form" method="POST" action="/forgot-verify-submit" novalidate>
        <input type="hidden" name="email" value="{{ email }}">
        <input type="hidden" name="otp" id="otp-value">
        <span class="legend" id="otp-label">Reset code</span>
        <div class="otp" role="group" aria-labelledby="otp-label" id="otp"></div>
        <p class="error" id="otp-error" role="alert">{{ error or '' }}</p>
        <button class="btn" type="submit">Verify code</button>
      </form>

      <p class="again">Didn't get it?
        <form method="POST" action="/forgot-submit" id="resend-form">
          <input type="hidden" name="email" value="{{ email }}">
          <button type="submit" class="linkbtn" id="resend" disabled>Resend code</button>
        </form>
      </p>
      <p class="again">Wrong address? <a href="/forgot">Try again</a></p>
    </div>
    <p class="legal">Check your spam folder if nothing arrives in a minute.</p>
  </main>

<script>
  const LENGTH = 6, RESEND_SECONDS = 30;
  const $ = (id) => document.getElementById(id);
  const boxes = [];
  const hasServerError = $('otp-error').textContent.trim() !== '';

  for (let i = 0; i < LENGTH; i++) {
    const b = document.createElement('input');
    b.type = 'text'; b.inputMode = 'numeric'; b.maxLength = 1;
    b.autocomplete = i === 0 ? 'one-time-code' : 'off';
    b.setAttribute('aria-label', 'Digit ' + (i + 1) + ' of ' + LENGTH);
    b.setAttribute('aria-invalid', hasServerError ? 'true' : 'false');
    $('otp').append(b);
    boxes.push(b);
  }
  boxes[0].focus();

  const code = () => boxes.map((b) => b.value).join('');
  function setError(msg) {
    $('otp-error').textContent = msg;
    boxes.forEach((b) => b.setAttribute('aria-invalid', msg ? 'true' : 'false'));
  }
  function fill(digits, start) {
    let i = start;
    for (const ch of digits) { if (i >= LENGTH) break; boxes[i++].value = ch; }
    boxes[Math.min(i, LENGTH - 1)].focus();
  }
  function submitIfFull() {
    if (code().length === LENGTH) $('code-form').requestSubmit();
  }

  boxes.forEach((box, i) => {
    box.addEventListener('input', () => {
      const digits = box.value.replace(/\D/g, '');
      box.value = '';
      if (digits) fill(digits, i);
      setError('');
      submitIfFull();
    });
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !box.value && i > 0) { boxes[i - 1].value = ''; boxes[i - 1].focus(); }
      else if (e.key === 'ArrowLeft' && i > 0) boxes[i - 1].focus();
      else if (e.key === 'ArrowRight' && i < LENGTH - 1) boxes[i + 1].focus();
    });
    box.addEventListener('paste', (e) => {
      e.preventDefault();
      const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, LENGTH);
      if (!digits) return;
      fill(digits, 0); setError(''); submitIfFull();
    });
    box.addEventListener('focus', () => box.select());
  });

  $('code-form').addEventListener('submit', (e) => {
    const v = code();
    if (v.length < LENGTH) {
      e.preventDefault();
      setError('Enter all ' + LENGTH + ' digits of the code.');
      (boxes.find((b) => !b.value) || boxes[0]).focus();
      return;
    }
    $('otp-value').value = v;   // sent to Flask as "otp"
  });

  // Resend countdown
  let left = RESEND_SECONDS;
  const resend = $('resend');
  resend.textContent = 'Resend code in ' + left + 's';
  const timer = setInterval(() => {
    left--;
    if (left <= 0) {
      clearInterval(timer);
      resend.disabled = false;
      resend.textContent = 'Resend code';
    } else {
      resend.textContent = 'Resend code in ' + left + 's';
    }
  }, 1000);
</script>
</body>
</html>
