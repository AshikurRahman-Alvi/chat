<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set new password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E5D3AF; --card: #F5EFE1; --ink: #2e0a0e; --muted: #6b4b4e;
    --line: #E5D3AF; --edge: #AEC4D4; --field: color-mix(in srgb, #F5EFE1 45%, white);
    --accent: #790D16; --accent-hover: #5c0a11; --accent-ink: #F5EFE1;
    --focus: #AEC4D4; --error: #790D16;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body);
    font-size: 16px; line-height: 1.5; min-height: 100%;
    display: grid; place-items: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(40px + env(safe-area-inset-bottom, 0px));
  }
  .card {
    position: relative; width: 100%; max-width: 420px; background: var(--card);
    border-radius: 28px 28px 28px 6px; padding: 40px 32px 32px; margin-bottom: 18px;
  }
  .card::after {
    content: ""; position: absolute; left: 0; bottom: -18px; width: 26px; height: 20px;
    background: var(--card); clip-path: polygon(0 0, 100% 0, 0 100%);
  }
  h1 { font-family: var(--display); font-weight: 700; font-size: 2.1rem; line-height: 1.1; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin-top: 8px; margin-bottom: 28px; }
  .sub strong { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
  .field { margin-bottom: 18px; }
  label, .legend { display: block; font-weight: 600; font-size: 0.95rem; margin-bottom: 6px; }
  a, .linkbtn {
    color: var(--accent); text-decoration: none; font: inherit; font-weight: 600;
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  a:hover, .linkbtn:hover { text-decoration: underline; text-underline-offset: 3px; }
  .linkbtn:disabled { color: var(--muted); cursor: default; font-weight: 500; text-decoration: none; }
  input {
    width: 100%; font: inherit; color: var(--ink); background: var(--field);
    border: 1.5px solid var(--edge); border-radius: 14px; padding: 13px 16px;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--muted); opacity: .8; }
  input:hover { border-color: var(--muted); }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  input[aria-invalid="true"] { border-color: var(--error); }
  .error { color: var(--error); font-size: 0.875rem; margin-top: 6px; }
  .error:empty { display: none; }
  .btn {
    width: 100%; font: inherit; font-weight: 600; color: var(--accent-ink);
    background: var(--accent); border: 0; border-radius: 14px; padding: 14px 16px;
    margin-top: 6px; cursor: pointer; transition: background .15s, transform .1s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(.985); }
  .btn:focus-visible, .linkbtn:focus-visible, a:focus-visible {
    outline: 3px solid var(--edge); outline-offset: 2px; border-radius: 6px;
  }
  .divider { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 0.875rem; margin: 24px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .signin, .again { text-align: center; color: var(--muted); }
  .again { margin-top: 18px; }
  .again form { display: inline; }
  .otp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 4px; }
  .otp input {
    min-width: 0; aspect-ratio: 1 / 1.15; font-family: var(--display);
    font-size: 1.6rem; font-weight: 700; text-align: center; padding: 0;
  }
  .legal { max-width: 420px; padding-left: 28px; color: var(--muted); font-size: 0.8125rem; }
  @media (max-width: 420px) { .card { padding: 32px 22px 26px; } .legal { padding-left: 22px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <main style="width:100%;max-width:420px">
    <div class="card">
      <h1>Set a new password</h1>
      <p class="sub">Choose a password with at least 8 characters.</p>

      <form id="reset" method="POST" action="/reset-password" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" autocomplete="new-password"
                 placeholder="New password" minlength="8" required>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password"
                 placeholder="Repeat password" minlength="8" required>
          <p class="error" id="reset-error" role="alert">{{ error or '' }}</p>
        </div>
        <button class="btn" type="submit">Update password</button>
      </form>

      <div class="divider" role="separator">OR</div>
      <p class="signin"><a href="/">Back to log in</a></p>
    </div>
  </main>

<script>
  const form = document.getElementById('reset');
  const pw = document.getElementById('password');
  const cf = document.getElementById('confirm');
  const err = document.getElementById('reset-error');

  form.addEventListener('submit', (e) => {
    let msg = '';
    if (pw.value.length < 8) msg = 'Use at least 8 characters.';
    else if (pw.value !== cf.value) msg = "Passwords don't match.";
    if (msg) {
      e.preventDefault();
      err.textContent = msg;
      [pw, cf].forEach((i) => i.setAttribute('aria-invalid', 'true'));
      (pw.value.length < 8 ? pw : cf).focus();
    }
  });
  [pw, cf].forEach((i) => i.addEventListener('input', () => {
    err.textContent = '';
    [pw, cf].forEach((x) => x.setAttribute('aria-invalid', 'false'));
  }));
</script>
</body>
</html>
