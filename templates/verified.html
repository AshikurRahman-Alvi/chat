<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Email verified</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet" />
    <style>
      :root {
        --bg: #e5d3af;
        --card: #f5efe1;
        --ink: #2e0a0e;
        --muted: #6b4b4e;
        --edge: #aec4d4;
        --accent: #790d16;
        --accent-hover: #5c0a11;
        --accent-ink: #f5efe1;
        --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
        --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        font-size: 16px;
        line-height: 1.5;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 20px 40px;
      }

      .card {
        position: relative;
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border-radius: 28px 28px 28px 6px;
        padding: 44px 32px 32px;
        margin-bottom: 18px;
        text-align: center;
      }
      .card::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -18px;
        width: 26px;
        height: 20px;
        background: var(--card);
        clip-path: polygon(0 0, 100% 0, 0 100%);
      }

      .badge {
        width: 88px;
        height: 88px;
        margin: 0 auto 24px;
        display: block;
      }
      .badge circle {
        fill: var(--accent);
      }
      .badge path {
        fill: none;
        stroke: var(--accent-ink);
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
        animation: draw 0.5s 0.2s ease-out forwards;
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      h1 {
        font-family: var(--display);
        font-weight: 700;
        font-size: 2.1rem;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      .sub {
        color: var(--muted);
        margin-top: 10px;
        margin-bottom: 28px;
      }
      .sub strong {
        color: var(--ink);
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .btn {
        display: block;
        width: 100%;
        font: inherit;
        font-weight: 600;
        color: var(--accent-ink);
        background: var(--accent);
        border-radius: 14px;
        padding: 14px 16px;
        text-align: center;
        text-decoration: none;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .btn:hover {
        background: var(--accent-hover);
      }
      .btn:active {
        transform: scale(0.985);
      }
      .btn:focus-visible {
        outline: 3px solid var(--edge);
        outline-offset: 2px;
      }

      .legal {
        max-width: 420px;
        padding-left: 28px;
        color: var(--muted);
        font-size: 0.8125rem;
      }

      @media (max-width: 420px) {
        .card {
          padding: 36px 22px 26px;
        }
        .legal {
          padding-left: 22px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
        .badge path {
          animation: none;
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
  <body>
    <main style="width: 100%; max-width: 420px">
      <div class="card">
        <svg class="badge" viewBox="0 0 88 88" aria-hidden="true">
          <circle cx="44" cy="44" r="44" />
          <path d="M27 45 l12 12 l23 -26" />
        </svg>

        <h1>Email verified</h1>
        <p class="sub" id="message">
          Your account is ready. You can log in and start chatting.
        </p>

        <a class="btn" href="/login">Continue to log in</a>
      </div>

      <p class="legal">You can close this page after logging in.</p>
    </main>
  </body>
</html>
